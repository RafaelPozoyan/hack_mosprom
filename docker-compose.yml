# Корсик — полностью локальный контур: данные и модели не покидают периметр компании.
# Полное демо: docker compose --profile local-llm --profile app up -d --build --wait (см. README).
name: korsik

# --max-batch-tokens 2048: прогрев TEI резервирует память под максимальный батч (по умолчанию 16384 токена — >10 ГБ ОЗУ
# на модель); наши чанки короче ~600 токенов, поэтому лимит не влияет на качество, только на пиковую память.
x-tei: &tei
  image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
  platform: linux/amd64 # CPU-образ TEI не содержит arm64; на Apple Silicon нужна эмуляция.
  volumes: [hf-cache:/data]
  cpus: 4
  healthcheck:
    test: ['CMD', 'curl', '-fsS', '--max-time', '3', 'http://127.0.0.1/health']
    interval: 10s
    timeout: 5s
    # На первом запуске модель скачивается; окно ожидания — запас команды, не замер скорости.
    start_period: 30m
    retries: 3
  restart: unless-stopped

services:
  db:
    image: pgvector/pgvector:pg18
    environment: { POSTGRES_USER: korsik, POSTGRES_PASSWORD: korsik, POSTGRES_DB: korsik }
    ports: ['55433:5432']
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U korsik']
      interval: 5s
      retries: 20
    restart: unless-stopped

  embed: # BGE-M3: мультиязычные эмбеддинги, лучшая связка с bge-reranker-v2-m3 на русском IR-бенчмарке RusBEIR
    <<: *tei
    command: --model-id BAAI/bge-m3 --served-model-name embed --max-batch-tokens 2048
    ports: ['8082:80']

  rerank:
    <<: *tei
    # те же веса BAAI/bge-reranker-v2-m3, экспорт в ONNX: TEI запускает его на ONNX Runtime — на CPU в разы быстрее candle
    command: --model-id onnx-community/bge-reranker-v2-m3-ONNX --max-batch-tokens 2048
    ports: ['8083:80']

  docling: # layout-анализ и OCR сканов (PDF, DOCX, PPTX, изображения)
    image: quay.io/docling-project/docling-serve-cpu:v1.37.0
    ports: ['5001:5001']
    environment:
      DOCLING_SERVE_MAX_SYNC_WAIT: '900' # OCR длинного скана на CPU занимает минуты
    volumes:
      # в образе Tesseract только с английским; русская модель tessdata_best (github.com/tesseract-ocr/tessdata_best)
      - ./ocr/rus.traineddata:/usr/share/tesseract/tessdata/rus.traineddata:ro
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          'import urllib.request; urllib.request.urlopen("http://127.0.0.1:5001/ready", timeout=3)',
        ]
      interval: 10s
      timeout: 5s
      start_period: 30m
      retries: 3
    restart: unless-stopped

  llm: # GigaChat 3.1 Lightning (MoE 10B / 1.8B активных, MIT) — работает даже на CPU
    image: ghcr.io/ggml-org/llama.cpp:server
    profiles: [local-llm]
    command: >
      -m /models/GigaChat3.1-10B-A1.8B-q4_K_M.gguf --host 0.0.0.0 --port 8081
      -c 16384 -np 2 --jinja -a gigachat-3.1-lightning
    volumes: ['${MODELS_DIR:-~/.cache/polyplastic-models/gigachat31}:/models:ro']
    ports: ['8081:8081']
    healthcheck:
      test: ['CMD', 'curl', '-fsS', '--max-time', '3', 'http://127.0.0.1:8081/health']
      interval: 10s
      timeout: 5s
      start_period: 30m
      retries: 3
    restart: unless-stopped

  api:
    build: .
    profiles: [app]
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://korsik:korsik@db:5432/korsik
      EMBED_URL: http://embed
      RERANK_URL: http://rerank
      DOCLING_URL: http://docling:5001
      LLM_BASE_URL: ${LLM_BASE_URL:-http://llm:8081/v1}
    ports: ['8000:8000']
    volumes:
      - api-data:/app/data
      - ./materials:/materials:ro # материалы кейса (в git не хранятся) для scripts/seed.py
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=3)',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:
  hf-cache:
  api-data:
