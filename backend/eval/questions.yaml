# Набор для оценки RAG. Вопросы сформулированы так, как спросил бы новичок, а не цитатами из документа.
# must   — фраза из документа (после OCR) или список фраз, если ответ есть в нескольких местах → метрики поиска;
# expect — что обязано прозвучать в ответе бота → фактическая точность ответа;
# answerable: false — ответа в базе знаний нет (проверено поиском по всем документам): бот обязан отказаться.

- {q: "Во сколько начинается рабочий день?", must: "начало работы — 9:00", expect: ["9"]}
- {q: "До скольки работаем в пятницу?", must: "окончание работы — 17:00", expect: ["17"]}
