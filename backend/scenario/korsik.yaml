# ───────────────────────── Аналитика настроений ─────────────────────────
# Таксономия для NLP-анализа свободных ответов. Темы — из вопросов опросов ТЗ, риски — из формулировок кейса
# («токсичность в коллективе», «непонимание задач», «проблемы с доступами», «конфликт с наставником»)
# и тревожных вариантов ответов ТЗ. Эмоции — классы датасета CEDR (Sboev et al., 2021).
analytics:
  topics: [оформление и документы, доступы и техника, задачи и цели, руководитель, наставник, коллектив,
           поддержка HR, нагрузка, ожидания от работы, другие подразделения, адаптационный план,
           условия труда и быт, правила и регламенты, другое]
  risk_flags: [проблемы с доступами, непонимание задач, недостаток информации, конфликт с наставником или руководителем,
               токсичность в коллективе, сложности в коллективе, перегрузка и выгорание, низкая вовлечённость,
               отсутствие поддержки, трудности с оформлением, отставание от адаптационного плана,
               сомнения в продолжении работы, намерение уйти]
  emotions: [радость, грусть, удивление, страх, злость]
  # Политика реакции — решение HR, редактируется здесь:
  # high — HR получает «красный флаг» сразу, сотруднику предлагается конфиденциальная связь с HR;
  # manager_actionable — руководителю уходит push «рекомендуем встречу 1:1».
  # Сигналы про руководителя и токсичность руководителю не отправляются никогда.
  high: [намерение уйти, конфликт с наставником или руководителем, токсичность в коллективе, перегрузка и выгорание]
  manager_actionable: [непонимание задач, недостаток информации, проблемы с доступами, отставание от адаптационного плана]
  never_to_manager: [конфликт с наставником или руководителем, токсичность в коллективе, намерение уйти,
                     сомнения в продолжении работы]

# ───────────────────────── Опросы (ТЗ) ─────────────────────────
# Пороги из ТЗ: «В случае ответа ниже 8 в боте должно открываться диалоговое окно с просьбой указать причину».
# offer — кнопки «передать проблему через Корсика» (relay) и «связаться с рекрутером» (recruiter).
# flag — сигнал для HR-аналитики; формулировки взяты из кейса («проблемы с доступами», «непонимание задач» и т.д.).
surveys:
  day3:
    title: Опрос по итогам третьего рабочего дня
    questions:
      - id: docs
        text: "Вопрос 1: Были ли вопросы при оформлении?"
        type: choice
        options:
          - {id: a, text: "Все отлично!"}
          - id: b
            text: "Остались вопросы"
            reply: "Хорошо, я {тебя|вас} понял! {Помни|Помните}, что {ты всегда можешь|вы всегда можете} связаться с рекрутером, описать проблему или задать интересующие {тебя|вас} вопросы."
            offer: [recruiter]
          - id: c
            text: "Возникли трудности с документами"
            flag: "трудности с оформлением"
            ask: "Очень важно иметь возможность полноценно изучить подписываемые документы. Я буду благодарен, если {ты поделишься|вы поделитесь} с нами, почему у {тебя|вас} не получилось этого сделать. В чем заключалась проблема?"
            offer: [relay, recruiter]
      - id: team
        text: "Вопрос 2: Как {тебя|вас} встретили новые коллеги?"
        type: choice
        options:
          - {id: a, text: "Отлично!"}
          - {id: b, text: "Пока присматриваюсь"}
          - id: c
            text: "Никак, все заняты"
            flag: "сложности в коллективе"
            reply: "Жалко, что не удалось познакомиться с новыми коллегами. Скорее всего, {ты вышел|вы вышли} на работу в период большой нагрузки, такое бывает. Но если {тебе кажется|вам кажется}, что что-то пошло не так, то не {бойся|бойтесь} поднять этот вопрос со своим руководителем или написать моим коллегам в HR. Мы всегда готовы помочь."
            offer: [relay, recruiter]
      - id: tasks
        text: "Вопрос 3: Понятны ли {тебе|вам} задачи на испытательный срок?"
        type: choice
        options:
          - {id: a, text: "Да, все понятно!", reply: "Отлично 💪🏻"}
          - id: b
            text: "Жду разъяснений от руководителя"
            reply: "Хорошо. Если в ближайшее время {ты не получишь|вы не получите} разъяснения по своим задачам, то лучше всего будет напрямую обсудить этот вопрос с руководителем. Также {помни|помните}, что {ты всегда можешь|вы всегда можете} связаться с рекрутером, описать проблему или задать интересующие {тебя|вас} вопросы. Мы всегда готовы помочь."
            offer: [recruiter]
          - id: c
            text: "Пока ничего не понял"
            flag: "непонимание задач"
            reply: "Понимание своих задач на испытательном сроке — ключевой элемент его успешного прохождения. Если у {тебя|вас} нет четкого представления, в чем будет заключаться {твоя|ваша} работа на ближайшие три месяца, то лучше всего обсудить этот вопрос с руководителем. Если недопонимание так и не прояснилось после общения с руководителем, то {ты всегда можешь|вы всегда можете} написать моим коллегам в отдел подбора персонала."
            offer: [relay, recruiter]
    outro: "Спасибо за обратную связь!\nУвидимся завтра 👋🏻"

  week2:
    title: Чек через 2 недели
    questions:
      - {id: tasks_clear, text: "1. Вам понятны поставленные задачи?", type: yesno, comment_on: "no", flag: "непонимание задач"}
      - {id: info_enough, text: "2. Вам достаточно информации для качественного выполнения вашей работы?", type: yesno, comment_on: "no", flag: "недостаток информации"}
      - {id: manager_available, text: "3. Насколько доступен ваш руководитель для вопросов и обратной связи?", type: scale, min_label: "недоступен", max_label: "всегда доступен", comment_below: 8, topic: "руководитель"}
      - {id: manager_feedback, text: "4. Оцените качество обратной связи от руководителя.", type: scale, min_label: "отсутствует", max_label: "исчерпывающая", comment_below: 8, topic: "руководитель"}
      - {id: peers_support, text: "5. Насколько ваши коллеги оказывают поддержку при появлении вопросов или сложностей в работе?", type: scale, min_label: "нет взаимодействия", max_label: "отличное взаимодействие", comment_below: 8, topic: "коллектив"}
      - {id: it_support, text: "6. Оцените уровень поддержки по вопросам, связанным с настройкой и предоставлением доступов/техники/рабочего пространства.", type: scale, min_label: "низкий", max_label: "высокий", comment_below: 8, topic: "доступы и техника"}
      - {id: access_timely, text: "7. Насколько своевременно были предоставлены необходимые доступы?", type: scale, min_label: "были задержки", max_label: "без задержек", comment_below: 8, topic: "доступы и техника"}
      - {id: hr_support, text: "8. Как вы оцениваете качество поддержки от HR по возникающим вопросам?", type: scale, min_label: "низкое", max_label: "очень высокое", comment_below: 8, topic: "поддержка HR"}
      - {id: hr_onboarding, text: "9. Оцените, пожалуйста, качество поддержки HR в подготовке к трудоустройству.", type: scale, min_label: "низкое", max_label: "очень высокое", comment_below: 8, topic: "оформление"}
    outro: "Спасибо, что {нашёл|нашли} время! Все ответы увидит команда адаптации 💙"

  plan:
    title: Как идёт работа по адаптационному плану
    questions:
      - id: progress
        text: "{Подскажи|Подскажите}, как идет работа по адаптационному плану?"
        type: choice
        options:
          - {id: a, text: "Все хорошо! Продвигаюсь по плану", reply: "Прекрасно! Тогда {продолжай|продолжайте} в том же духе 💪🏻"}
          - {id: b, text: "Все ок! Немного отстаю от графика", reply: "Прекрасно! Тогда {продолжай|продолжайте} в том же духе 💪🏻"}
          - id: c
            text: "Я отстаю от графика"
            flag: "отставание от адаптационного плана"
            reply: "Спасибо за обратную связь! {Ты можешь|Вы можете} связаться с HR-специалистом с помощью команды /hr или направить сообщение через меня, описав трудности, с которыми {ты столкнулся|вы столкнулись}."
            offer: [relay, recruiter]

  month2:
    title: Опрос по итогам двух месяцев работы
    questions:
      - id: mood
        text: "1) С каким настроением {ты ежедневно приходишь|вы ежедневно приходите} на работу?"
        type: choice
        options:
          - {id: a, text: "С отличным! Мне все нравится!"}
          - id: b
            text: "С безразличным: поработал и ушел"
            flag: "низкая вовлечённость"
            reply: "Очень жаль, что работа не приносит {тебе|вам} удовольствие. Если я и мои коллеги можем помочь {тебе|вам} чем-то, {направь|направьте} вопрос в отдел подбора персонала. Мы вместе постараемся придумать решение и сделать {твою|вашу} жизнь на работе комфортнее."
            offer: [relay, recruiter]
          - id: c
            text: "Уже устал, а задачи все валятся"
            flag: "перегрузка и выгорание"
            reply: "Мы все иногда можем сталкиваться с большим объемом работы, короткими сроками или слишком высокими ожиданиями со стороны руководства и коллег. Все это может создать большое давление и привести к отрицательным последствиям для физического и эмоционального здоровья. 😞\nСостояние эмоционального напряжения не является нормой, и в таком случае я бы рекомендовал обратиться в отдел подбора персонала: описать свою проблему, чтобы мы вместе придумали, как исправить ситуацию и сделать {твою|вашу} жизнь на работе комфортнее."
            offer: [relay, recruiter]
      - id: helpers
        text: "2) Кто {тебе|вам} помогает в период испытательного срока? (можно выбрать несколько вариантов)"
        type: multi
        options:
          - {id: manager, text: "Руководитель"}
          - {id: peers, text: "Коллеги"}
          - {id: recruiter, text: "Рекрутер"}
          - id: nobody
            text: "Никто!"
            exclusive: true
            flag: "отсутствие поддержки"
            reply: "Поддержка — важная составляющая успешной адаптации. Я всегда готов помочь {тебе|вам}! Но какие-то вопросы слишком сложные, чтобы я мог решить их самостоятельно. В таких случаях {ты всегда можешь|вы всегда можете} обратиться за помощью к рекрутеру."
            offer: [relay, recruiter]
      - id: accelerate
        text: "3) Что помогло бы ускорить {твою|вашу} адаптацию?"
        type: choice
        options:
          - {id: remote, text: "Удаленный формат работы", sites: [GrPP, Luzhniki]}
          - {id: clear_tasks, text: "Более четкие задачи"}
          - {id: automation, text: "Автоматизация процессов"}
          - {id: peers_help, text: "Помощь коллег"}
          - {id: other, text: "Свой вариант", ask: "{Напиши|Напишите}, пожалуйста, свой вариант 🙂"}
    outro: "Спасибо за обратную связь!"

  final:
    title: Опрос по итогам испытательного срока
    questions:
      - id: hardest
        text: "Вопрос 1: Что было самым сложным в период адаптации?"
        type: choice
        options:
          - {id: a, text: "Со всем справился"}
          - {id: b, text: "Коммуникации с другими отделами"}
          - {id: c, text: "Нечеткие задачи"}
          - {id: d, text: "Другое", ask: "{Расскажи|Расскажите}, пожалуйста, что именно было сложным?"}
      - id: stay
        text: "Вопрос 2: {Планируешь ли ты|Планируете ли вы} продолжить работу по итогам испытательного срока?"
        type: choice
        options:
          - {id: a, text: "Да, однозначно!", reply: "Мы рады видеть {тебя|вас} в нашей команде и надеемся, что {ты останешься|вы останетесь} с нами на долгое время! 🎉"}
          - id: b
            text: "Не уверен"
            flag: "сомнения в продолжении работы"
            ask: "Могу ли я поинтересоваться, в чем причина {твоих|ваших} сомнений по поводу нашей компании?"
            offer: [recruiter_voice]
          - id: c
            text: "Нет, задумываюсь об уходе"
            flag: "намерение уйти"
            ask: "Очень жаль, что {ты сомневаешься|вы сомневаетесь} в дальнейшем сотрудничестве с нами. Могу ли я поинтересоваться, что на это повлияло?"
            offer: [recruiter_voice]
      - {id: load, text: "Оцените уровень нагрузки по задачам", type: scale, min_label: "очень некомфортная", max_label: "полностью комфортная", comment_below: 8, topic: "нагрузка"}
      - {id: expectations, text: "Насколько ваши ожидания от работы совпадают с реальностью?", type: scale, min_label: "разочаровали", max_label: "превзошли ожидания", comment_below: 8, topic: "ожидания"}
      - {id: info_enough, text: "Вам достаточно информации для качественного выполнения вашей работы?", type: yesno, comment_on: "no", flag: "недостаток информации"}
      - {id: manager_available, text: "Насколько доступен ваш руководитель для вопросов и обратной связи?", type: scale, min_label: "недоступен", max_label: "всегда доступен", comment_below: 8, topic: "руководитель"}
      - {id: manager_feedback, text: "Оцените качество обратной связи от руководителя.", type: scale, min_label: "отсутствует", max_label: "исчерпывающая", comment_below: 8, topic: "руководитель"}
      - {id: peers_support, text: "Насколько ваши коллеги оказывают поддержку при появлении вопросов или сложностей в работе?", type: scale, min_label: "нет взаимодействия", max_label: "отличное взаимодействие", comment_below: 8, topic: "коллектив"}
      - {id: departments, text: "Как вы оцениваете ваше взаимодействие с другими подразделениями?", type: scale, min_label: "плохо", max_label: "отличное взаимодействие", comment_below: 8, topic: "другие подразделения"}
      - {id: hr_support, text: "Как вы оцениваете качество поддержки от HR по возникающим вопросам?", type: scale, min_label: "низкое", max_label: "очень высокое", comment_below: 8, topic: "поддержка HR"}
      - {id: goals_done, text: "Насколько вам удалось реализовать поставленные на испытательный срок задачи?", type: scale, min_label: "совсем не удалось", max_label: "удалось полностью", comment_below: 8, topic: "задачи"}
      - {id: improve, text: "Вопрос 3: Что {порекомендуешь|порекомендуете} улучшить для более комфортной адаптации сотрудника?", type: text}
    outro: "Спасибо! Мы обязательно учтем {твои|ваши} рекомендации 💙"
    then: final_bye
