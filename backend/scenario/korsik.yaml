# Сценарий адаптации «Корсик» — перенос ТЗ «Финал. ТЗ. Чат-бот Корсик- 15.09.xlsx» в данные.
# Меняется без программиста: тексты, время, площадки, опросы. Перезагрузка — кнопкой в админке или рестартом.
#
# Подстановки: {name} — имя сотрудника; {ты|вы} — вариант по выбранной форме обращения (левый — «ты»).
# Для писем руководителю/рекрутеру: {employee}, {position}, {start_date}.
#
# Время шага (at):
#   event: start          — сразу после запуска бота по QR/диплинку с оффера
#   day: -1               — календарный сдвиг от даты выхода (без переноса)
#   workday: N            — N-й рабочий день (1 — день выхода)
#   days/weeks/months     — сдвиг от даты выхода, перенос на ближайший рабочий день
#   month_start: N        — первый день N-го месяца работы
#   probation_end: true   — последний день испытательного срока
# manual: true — шаг «по отмашке рекрутера» (ТЗ), запускается из карточки сотрудника в админке.

sites:
  GrPP: {name: "Группа ПОЛИПЛАСТИК — офис", kind: office}
  Luzhniki: {name: "Офис «Лужники»", kind: office}
  GTP: {name: "Производственная площадка GTP", kind: plant}

fallback:
  # ТЗ, строка «Если сотрудник задаст вопрос Корсику (просто так)» — теперь это ответ, когда в базе знаний нет ответа
  text: |
    Какие-то вопросы слишком сложные, чтобы я мог решить их самостоятельно. Я посоветуюсь с коллегами из подбора персонала и вернусь с ответом!
  image: img_13.png

reminder:
  # ТЗ: «Если Корсик запустил опрос, а сотрудник НЕ прошел его в течение 1 дня (напомнить на завтра + на послезавтра)»
  after_days: [1, 2]
  # Решение команды для пилота: сутки после двух напоминаний; это не SLA заказчика.
  escalate_after_days: 3
  required_text: |
    Привет, {name}! Напоминаю об обязательном шаге адаптации.
    Пожалуйста, {ответь|ответьте}, когда будет удобно. Если нужна помощь — {напиши|напишите} /hr.
  text: |
    Привет, {name}!
    Пишу с небольшим напоминанием, что {ты не прошёл|вы не прошли} опрос.
    Пожалуйста, не {забудь|забудьте} это сделать в ближайшее время.

    P.S.: Он займет всего 1-2 минуты!
  image: img_12.png

menu:
  text: |
    Чем могу помочь? {Напиши|Напишите} вопрос своими словами или {выбери|выберите} пункт ниже 👇
  buttons:
    - {text: "🍽 Где пообедать", goto: lunch_info}
    - {text: "📄 Документы для оформления", goto: documents_info}
    - {text: "🧭 Мой путь адаптации", action: progress}
    - {text: "🧑‍💼 Связаться с HR", action: relay_hr}

commands:
  start: menu
  menu: menu
  food: lunch_info
  hr: relay_hr

steps:
  # Решение команды 24.10: доступы, день 3, неделя 2 и итоговый опрос требуют ответа.
  # ───────────────────────── За 2-3 дня до выхода: запуск по QR с оффера ─────────────────────────
  - id: welcome
    title: "Знакомство с Корсиком (запуск по QR с оффера)"
    at: {event: start}
    messages:
      - text: |
          Добро пожаловать в нашу команду!
          Привет-привет-привет! 🐾 Меня зовут Корсик, ваш персональный гид по миру Группы ПОЛИПЛАСТИК! 🤗

          Рад знакомству и обещаю сделать вашу адаптацию веселой, легкой и комфортной! 💃 Вместе мы изучим компанию и найдем друзей среди лучших специалистов отрасли. 🌟

          Готов делиться секретами успешной интеграции, отвечать на ваши вопросы и помогать адаптироваться в новом коллективе! 👍

          Давайте начнем путешествие навстречу большим профессиональным успехам и теплым отношениям! ✨

          Корсик
        image: img_02.png
      - text: Как мы будем общаться?
        buttons:
          - - {text: "На ТЫ", set_form: ty, goto: intro}
            - {text: "На ВЫ", set_form: vy, goto: intro}

  - id: intro
    title: "Знакомство и что умеет бот"
    messages:
      - text: |
          Очень приятно с {тобой|вами} познакомиться, {name}!

          Меня зовут Корсик, я помогу {тебе|вам} быстро и легко адаптироваться на новом рабочем месте!

          В течение первых трех месяцев я буду сопровождать {тебя|вас} в пути, предоставлять информацию о компании, которая поможет {тебе|вам} лучше ориентироваться в рабочей среде.

          А ещё я отвечаю на вопросы о компании и внутренних правилах — {просто напиши|просто напишите} мне в любой момент.
        image: img_01.png
    then: [documents_info, transport_offer, company_facts, see_you]

  - id: documents_info
    title: "Список документов для оформления"
    sites: [GrPP, Luzhniki]
    messages:
      - text: |
          Для того, чтобы {ты пришёл|вы пришли} {подготовленным|подготовленными} в свой первый рабочий день, {ознакомься|ознакомьтесь} со списком необходимых для оформления документов и {подготовь|подготовьте} их к своему выходу на работу.

          Необходимые документы для трудоустройства:
          1. Бумажная трудовая книжка и сведения о трудовой деятельности (можно выгрузить с сайта госуслуг);
          2. Паспорт;
          3. СНИЛС;
          4. ИНН;
          5. Документ об образовании (диплом, свидетельства, удостоверения, допуски);
          6. Свидетельство о браке/разводе (в случае смены ФИО);
          7. Свидетельство о рождении ребенка (до 18 лет);
          8. Документы воинского учета.
        image: img_03.png

  - id: documents_info
    title: "Список документов для оформления"
    sites: [GTP]
    messages:
      - text: |
          Для того, чтобы {ты пришёл|вы пришли} {подготовленным|подготовленными} в свой первый рабочий день, {ознакомься|ознакомьтесь} со списком необходимых для оформления документов и {подготовь|подготовьте} их к своему выходу на работу.

          Необходимые документы для трудоустройства:
          1. Бумажная трудовая книжка и сведения о трудовой деятельности (можно выгрузить с сайта госуслуг);
          2. Паспорт;
          3. СНИЛС;
          4. ИНН;
          5. Документ об образовании (диплом, свидетельства, удостоверения, допуски);
          6. Свидетельство о браке/разводе (в случае смены ФИО);
          7. Свидетельство о рождении ребенка (до 18 лет);
          8. Документы воинского учета;
          9. Фотографии 3×4 в количестве 2 шт. (цвет/ЧБ).
        image: img_03.png

  - id: transport_offer
    title: "Корпоративный транспорт / как добраться"
    sites: [GrPP]
    messages:
      - text: Чтобы дорога до офиса была комфортнее, у нас есть корпоративный транспорт! Рассказать о маршрутах и расписании?
        buttons:
          - - {text: "Да, расскажи", goto: transport_info}
            - {text: "Не нужно", reply: "Хорошо! Если понадобится — просто {спроси|спросите} меня про корпоративный транспорт 🚌"}

  - id: transport_offer
    title: "Корпоративный транспорт / как добраться"
    sites: [GTP]
    messages:
      - text: Чтобы дорога до предприятия была комфортнее, у нас есть корпоративный транспорт! Рассказать о маршрутах и расписании?
        buttons:
          - - {text: "Да, расскажи", goto: transport_info}
            - {text: "Не нужно", reply: "Хорошо! Если понадобится — просто {спроси|спросите} меня про корпоративный транспорт 🚌"}

  - id: transport_offer
    title: "Корпоративный транспорт / как добраться"
    sites: [Luzhniki]
    messages:
      - text: Чтобы {ты легко спланировал|вы легко спланировали} свой маршрут в первый день, я собрал для {тебя|вас} всю информацию о том, как добраться до офиса. Интересно?
        buttons:
          - - {text: "Да!", goto: transport_info}
            - {text: "Не нужно", reply: "Хорошо! Если понадобится — просто {спроси|спросите} меня, как добраться до офиса 🗺"}

  - id: transport_info
    title: "Ответ ИИ: транспорт и маршрут"
    messages:
      - ai: Корпоративный транспорт и как добраться до площадки — маршруты и расписание

  - id: company_facts
    title: "Интересные факты о компании"
    messages:
      - text: |
          Я готов поделиться самыми интересными фактами о своей организации.

          🧑🏼‍🔧 Факт №1: Я горжусь тем, что работаю в компании, которая делает мир лучше каждый день! Наши инновационные трубы помогают обеспечивать чистой водой миллионы людей по всей стране. А ещё, {знаешь|знаете}, какое наше самое гордое достижение? Наша продукция помогает экономить природные ресурсы благодаря долговечности и энергоэффективности. {Представляешь|Представляете}, как круто создавать будущее экологически чистым способом?

          📚 Факт №2: {Знаешь|Знаете}, какой секрет успешной карьеры в нашем дружном коллективе? Здесь ценят инициативу и поддерживают таланты! Все сотрудники имеют равные возможности развиваться профессионально и строить карьеру. Даже я иногда участвую в тренингах и семинарах — расширяю кругозор и делюсь знаниями с новичками.

          🛠️ Факт №3: Кстати, {хочешь|хотите} посмотреть мир и почувствовать себя настоящим путешественником? Группа «ПОЛИПЛАСТИК» имеет филиалы по всей России и странам СНГ, так что {твоя|ваша} карьера может легко превратиться в захватывающее приключение. Стартуя с одного города, можно переехать куда угодно и покорять вершины успеха в любой точке страны. Ммм... интересно, правда же?

          {Присоединяйся|Присоединяйтесь} к нашей большой команде, ведь здесь {тебя|вас} ждут интересные проекты, поддержка коллег и большие перспективы!

  - id: see_you
    title: "До встречи перед выходом"
    messages:
      - text: |
          Очень скоро мы начнем полноценное погружение в компанию, а пока {отдыхай|отдыхайте}. Я напишу {тебе|вам} за день до выхода на работу.

          До встречи, {name}! 👋🏻

  # ───────────────────────── За день до выхода ─────────────────────────
  - id: day_before
    title: "Завтра первый рабочий день"
    at: {day: -1, time: "10:00"}
    messages:
      - text: |
          Привет, {name}! Уже завтра наступит {твой|ваш} первый рабочий день. {Ты готов|Вы готовы}?
        buttons:
          - {text: "Да, жду не дождусь!", reply: "Супер! Мне нравится {твой|ваш} настрой ✨\n\nВесь первый день мы проведем вместе, я {тебе|вам} расскажу все самое важное о нашей компании и пришлю много полезной информации, чтобы {твоё|ваше} погружение прошло как можно легче."}
          - {text: "Готов/Готова", reply: "Супер! Мне нравится {твой|ваш} настрой ✨\n\nВесь первый день мы проведем вместе, я {тебе|вам} расскажу все самое важное о нашей компании и пришлю много полезной информации, чтобы {твоё|ваше} погружение прошло как можно легче."}
          - {text: "Да, но немного волнуюсь", reply: "Это нормально — немного волноваться в {твой|ваш} первый рабочий день. Поверь мне, я сам через это все проходил, когда меня создавали 😓\n\nВесь первый день мы проведем вместе, я {тебе|вам} расскажу все самое важное о нашей компании и пришлю много полезной информации, чтобы {твоё|ваше} погружение прошло как можно легче."}
    then: [documents_reminder]

  - id: documents_reminder
    title: "Напоминание о документах"
    messages:
      - text: |
          Напоминаю про список необходимых для оформления документов — {подготовь|подготовьте} их к своему выходу на работу 📄
        buttons:
          - {text: "Показать список", goto: documents_info}

  - id: mgr_day_before
    title: "Руководителю: завтра выходит новичок"
    at: {day: -1, time: "10:00"}
    audience: manager
    messages:
      - text: |
          Завтра к вам в команду выходит новый сотрудник: {employee}, {position}.
          По сценарию адаптации в первый день Корсик спросит, всё ли готово с доступами и рабочим местом, а на 3-й рабочий день сотрудник получает адаптационный план от руководителя.

  # ───────────────────────── Первый рабочий день ─────────────────────────
  - id: d1_congrats
    title: "Поздравление с первым рабочим днём"
    at: {workday: 1, time: "10:00"}
    messages:
      - text: |
          Поздравляю с первым рабочим днем, {name}! 🥳

          Уверен, что {ты будешь|вы будете} отлично справляться со своими задачами, вносить свой вклад в наше общее дело и делиться идеями. Мы всегда готовы поддержать {тебя|вас} и создать комфортные условия для работы. Пожалуйста, не {стесняйся, обращайся|стесняйтесь, обращайтесь} к коллегам из нашей команды, мы всегда открыты для общения.
        image: img_04.png

  - id: d1_map
    title: "Карта территории / этажей"
    at: {workday: 1, time: "11:00"}
    sites: [GTP]
    messages:
      - text: Наша территория довольно большая, но я помогу {тебе|вам} в ней разобраться! {Хочешь|Хотите}, я покажу подробную карту?
        buttons:
          - - {text: "Да, покажи", goto: map_info}
            - {text: "Спасибо, не нужно", reply: "Хорошо! Если понадобится карта — просто {спроси|спросите} меня 🗺"}

  - id: d1_map
    title: "Карта территории / этажей"
    at: {workday: 1, time: "11:00"}
    sites: [Luzhniki]
    messages:
      - text: Наш офис довольно большой, но я помогу {тебе|вам} в нем разобраться! {Хочешь|Хотите}, я покажу подробную карту?
        buttons:
          - - {text: "Да, покажи", goto: map_info}
            - {text: "Спасибо, не нужно", reply: "Хорошо! Если понадобится карта — просто {спроси|спросите} меня 🗺"}

  - id: map_info
    title: "Карта"
    sites: [GTP]
    messages:
      - text: Вот карта территории 🗺
        image: map_gtp.png

  - id: map_info
    title: "Карта"
    sites: [Luzhniki]
    messages:
      - text: Вот карта этажей офиса 🗺
        image: map_luzhniki.png

  - id: d1_access
    required: true
    title: "Проверка доступов и рабочего места"
    at: {workday: 1, time: "12:00"}
    sites: [GrPP, Luzhniki]
    messages:
      - text: |
          {Тебе|Вам} предстоит многое узнать о нашей компании. Но сначала решим пару организационных вопросов.

          На {твоём|вашем} рабочем месте {тебя|вас} будет ждать необходимая техника. Для {тебя|вас} уже заведена учетная запись и доступы IT. Есть ли у {тебя|вас} все необходимые доступы и материалы?
        buttons:
          - - {text: "Да, все есть", reply: "Замечательно! Тогда пока {осваивайся|осваивайтесь}, а я напишу {тебе|вам} чуть позже."}
            - {text: "Нет", flag: "проблемы с доступами", reply: "Ничего страшного! В таком случае лучше всего уточнить у {твоего|вашего} руководителя, когда будут заведены доступы и предоставлены необходимые материалы."}
    then: [d1_postcard]

  - id: d1_access
    required: true
    title: "Проверка доступов и рабочего места"
    at: {workday: 1, time: "12:00"}
    sites: [GTP]
    messages:
      - text: |
          {Тебе|Вам} предстоит многое узнать о нашей компании. Но сначала решим пару организационных вопросов.

          К {твоему|вашему} первому рабочему дню мы подготовили рабочее место и необходимое оборудование. Всё настроено для начала работы. Все ли необходимое у {тебя|вас} в наличии?
        buttons:
          - - {text: "Да, все есть", reply: "Замечательно! Тогда пока {осваивайся|осваивайтесь}, а я напишу {тебе|вам} чуть позже."}
            - {text: "Нет", flag: "проблемы с доступами", reply: "Ничего страшного! В таком случае лучше всего уточнить у {твоего|вашего} руководителя, когда будут заведены доступы и предоставлены необходимые материалы."}
    then: [d1_postcard]

  - id: d1_postcard
    title: "Открытка"
    messages:
      - text: Дарю небольшую открытку!
        image: postcard_1.png

  - id: d1_lunch
    title: "Где пообедать"
    at: {workday: 1, time: "12:30"}
    messages:
      - text: "{Хочешь|Хотите}, подскажу, где пообедать?"
        buttons:
          - - {text: "Да!", goto: lunch_info}
            - {text: "Нет, спасибо!", reply: "Я {тебя|вас} понял! Если {ты передумаешь|вы передумаете}, {ты всегда можешь|вы всегда можете} набрать /food и я подскажу, где пообедать."}

  - id: lunch_info
    title: "Перечень заведений"
    messages:
      - text: Приятного аппетита! 🍽
        file: food_{site}.pdf

  - id: d1_contacts
    title: "Справочник контактов"
    at: {workday: 1, time: "13:00"}
    sites: [GrPP, Luzhniki]
    messages:
      - text: |
          Я думаю, {ты уже немного освоился|вы уже немного освоились} на рабочем месте и {успел|успели} познакомиться с небольшой частью нашего коллектива. В команде ПОЛИПЛАСТИК 8500 человек!

          Присылаю справочник с контактами сотрудников 💫
          https://my.polyplastic.ru/employees/Pages/address-book.aspx

          Обращаю внимание: справочник доступен исключительно с рабочих устройств внутри корпоративной сети либо при входе через корпоративную учётную запись.
        image: img_06.png

  - id: d1_contacts
    title: "Справочник контактов"
    at: {workday: 1, time: "13:00"}
    sites: [GTP]
    messages:
      - text: |
